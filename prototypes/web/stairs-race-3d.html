<meta charset="utf-8">
<title>계단 오르기 경주 3D</title>
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gaegu:wght@700&family=Noto+Sans+KR:wght@400;700&display=swap">
<style>
/* 3D 시제품: 가운데 16:9 3D 화면 + HTML HUD, 아래 터치 버튼. 2D 판과 규칙·난이도 동일. */
:root{
  --bg:#e9efe6; --ink:#2b2620; --muted:#5d6a5a; --panel:#fbfaf5; --line:#c9d3c4;
  --z:#e36b3c; --x:#3f7fbf; --c:#3c8a5a;
  --f-hand:"Gaegu","Comic Sans MS",cursive; --f-body:"Noto Sans KR",system-ui,sans-serif;
}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body)}
.wrap{max-width:980px;margin:0 auto;padding:20px 16px 32px;display:grid;gap:14px}
h1{margin:0;font-family:var(--f-hand);font-size:2rem;line-height:1.1}
.sub{margin:2px 0 0;color:var(--muted);font-size:.9rem}
.screen{position:relative;border:3px solid var(--ink);border-radius:14px;overflow:hidden;background:#cfe3ea;aspect-ratio:16/9}
.screen canvas{display:block;width:100%!important;height:100%!important}
.hud{position:absolute;inset:0;pointer-events:none;font-weight:700}
.chip{position:absolute;background:rgba(251,250,245,.92);border:3px solid var(--ink);border-radius:12px;padding:6px 12px}
#lives{left:12px;top:12px;color:#e8453c;letter-spacing:2px}
#time{right:12px;top:12px;font-size:1.3rem;min-width:70px;text-align:right}
#race{left:50%;top:12px;transform:translateX(-50%);width:42%;height:30px;padding:0 12px;display:flex;align-items:center}
#race .track{position:relative;flex:1;height:8px;border-radius:4px;background:#e0dbd0}
#race .dot{position:absolute;top:50%;width:18px;height:18px;margin:-9px 0 0 -9px;border-radius:50%;border:2px solid var(--ink)}
#breath{left:12px;bottom:12px;width:34%;display:flex;gap:10px;align-items:center;font-size:.85rem}
#breath .bar{position:relative;flex:1;height:16px;border:2px solid var(--ink);border-radius:8px;background:#fff;overflow:hidden}
#breath .zone{position:absolute;top:0;bottom:0;background:rgba(60,138,90,.3)}
#breath .fill{position:absolute;left:0;top:0;bottom:0;background:#7aa7d6}
#msg{left:50%;top:38%;transform:translate(-50%,-50%);font-family:var(--f-hand);font-size:2.6rem;border:none;background:none;text-shadow:0 2px 0 #fff,0 -2px 0 #fff,2px 0 0 #fff,-2px 0 0 #fff;white-space:nowrap}
#ov{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);text-align:center;max-width:80%;padding:16px 22px}
#ov h2{margin:0 0 6px;font-family:var(--f-hand);font-size:2rem}
#ov p{margin:2px 0;font-weight:400}
#load{position:absolute;inset:0;display:grid;place-items:center;font-weight:700;background:#cfe3ea}
.pads{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
.pad{font:700 1.05rem var(--f-body);color:#fff;border:3px solid var(--ink);border-radius:14px;padding:14px 8px;cursor:pointer;touch-action:manipulation;user-select:none}
.pad small{display:block;font-weight:400;font-size:.78rem;opacity:.9}
.pad:active,.pad.hit{transform:translateY(2px);filter:brightness(.92)}
#pz{background:var(--z)} #px{background:var(--x)} #pc{background:var(--c)}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center;justify-content:space-between}
.diff{display:flex;gap:6px;flex-wrap:wrap}
.diff button{font:700 .85rem var(--f-body);padding:8px 12px;border:2px solid var(--ink);border-radius:10px;background:var(--panel);color:var(--ink);cursor:pointer}
.diff button[aria-pressed="true"]{background:var(--ink);color:var(--panel)}
.help{background:var(--panel);border:2px dashed var(--line);border-radius:12px;padding:12px 14px;font-size:.9rem;line-height:1.6}
kbd{font:700 .8rem var(--f-body);border:2px solid var(--ink);border-bottom-width:3px;border-radius:6px;padding:0 6px;background:#fff}
@media (max-width:600px){#race{width:36%}#breath{width:55%}#msg{font-size:1.8rem}}
</style>

<div class="wrap">
  <div class="row">
    <div>
      <h1>계단 오르기 경주 3D</h1>
      <p class="sub">3D 화면 시험판 · 규칙과 난이도는 2D 판과 같아요. 캐릭터는 동작 확인용 무료(CC0) 로봇 모델이에요.</p>
    </div>
    <div class="diff" role="group" aria-label="난이도">
      <button id="d1" aria-pressed="false">1구간 쉬움</button>
      <button id="d3" aria-pressed="true">3구간 보통</button>
      <button id="d5" aria-pressed="false">5구간 어려움</button>
    </div>
  </div>
  <div class="screen" id="screen">
    <div class="hud">
      <div class="chip" id="lives">♥♥♥♥♥</div>
      <div class="chip" id="race"><div class="track"><div class="dot" id="dr" style="background:#3c8a5a"></div><div class="dot" id="dp" style="background:#e36b3c"></div></div></div>
      <div class="chip" id="time">40.0초</div>
      <div class="chip" id="breath">숨<div class="bar"><div class="zone" id="zone"></div><div class="fill" id="bfill"></div></div></div>
      <div class="chip" id="msg"></div>
      <div class="chip" id="ov"></div>
    </div>
    <div id="load">3D 장면 불러오는 중…</div>
  </div>
  <div class="pads">
    <button class="pad" id="pz">왼발<small>Z 또는 J</small></button>
    <button class="pad" id="px">오른발<small>X 또는 K</small></button>
    <button class="pad" id="pc">심호흡<small>C 또는 L</small></button>
  </div>
  <div class="help"><b>하는 법</b> · 시작은 <kbd>Space</kbd> 또는 화면 클릭 · 왼발·오른발을 번갈아 눌러 한 칸씩 올라가고, 숨 게이지가 초록 구간일 때 심호흡하세요. 40초 안에 아저씨보다 먼저 정상에 닿으면 승리.</div>
</div>

<script type="importmap">
{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}
</script>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
import * as SkeletonUtils from 'three/addons/utils/SkeletonUtils.js';
import {OutlineEffect} from 'three/addons/effects/OutlineEffect.js';

// ---------- 규칙 (2D 판과 동일) ----------
const STEPS=70, TIME=40;
const DIFF={1:{rival:3.6,breath:5.0,lo:55,hi:95},3:{rival:4.7,breath:6.0,lo:62,hi:94},5:{rival:6.8,breath:8.5,lo:72,hi:92}};
let diff=3, lives=5;
const S={};
function reset(){Object.assign(S,{state:'ready',t:0,cd:3,p:0,r:0,last:null,stun:0,gasp:0,breath:20,boost:0,rNext:0,rPause:0,lastStep:-1,msg:'',msgT:0,result:null,stars:0,pv:0,rv:0,pRate:0,rRate:0});showOverlay();}
let ac=null;
function beep(f,d=0.07,type='square',v=0.06){try{ac=ac||new AudioContext();const o=ac.createOscillator(),gn=ac.createGain();o.type=type;o.frequency.value=f;gn.gain.value=v;gn.gain.exponentialRampToValueAtTime(0.0001,ac.currentTime+d);o.connect(gn).connect(ac.destination);o.start();o.stop(ac.currentTime+d);}catch(e){}}
function say(m,t=0.8){S.msg=m;S.msgT=t;}
function press(k){
  if(S.state==='ready'||S.state==='result'){if(k==='start'){if(S.state==='result')reset();S.state='count';S.cd=3;beep(440,.1);hideOverlay();}return;}
  if(S.state!=='play'||k==='start')return;
  if(S.gasp>0||S.stun>0){S.last=null;return;}
  if(k==='C'){const D=DIFF[diff];
    if(S.breath>=D.lo&&S.breath<=D.hi){S.breath=Math.max(0,S.breath-55);S.boost=2;S.stun=0.3;say('좋은 호흡!');beep(660,.12,'sine',.08);}
    else{S.breath=Math.max(0,S.breath-15);S.stun=0.6;say(S.breath<40?'아직 괜찮은데…':'늦었다!');beep(220,.1,'sine');}
    return;}
  if(k===S.last){S.stun=0.5;say('휘청!');beep(140,.15,'sawtooth',.05);S.last=null;return;}
  if(S.t-S.lastStep<0.13){S.last=k;return;}
  S.pRate=1/Math.max(0.12,S.t-S.lastStep);S.lastStep=S.t;
  S.last=k;S.p=Math.min(STEPS,S.p+1);
  S.breath+=S.boost>0?DIFF[diff].breath*0.6:DIFF[diff].breath;
  beep(k==='Z'?520:600,.04);
  if(S.breath>=100){S.breath=100;S.gasp=1.6;say('헉… 헉…',1.6);beep(110,.3,'triangle',.08);}
  if(S.p>=STEPS)finish(true);
}
function finish(win){S.state='result';S.result=win;
  if(win){const m=S.p-S.r;S.stars=m>12?3:m>5?2:1;beep(523,.12,'sine',.09);setTimeout(()=>beep(784,.2,'sine',.09),120);}
  else{lives=Math.max(0,lives-1);beep(196,.3,'triangle',.08);}
  setTimeout(showOverlay,900);}
const keymap={KeyZ:'Z',KeyJ:'Z',KeyX:'X',KeyK:'X',KeyC:'C',KeyL:'C',Space:'start',Enter:'start'};
addEventListener('keydown',e=>{const k=keymap[e.code];if(!k||e.repeat)return;if(e.target.closest&&e.target.closest('.diff'))return;e.preventDefault();press(k);flash(k);});
function flash(k){const b=document.getElementById({Z:'pz',X:'px',C:'pc'}[k]||'');if(!b)return;b.classList.add('hit');setTimeout(()=>b.classList.remove('hit'),80);}
[['pz','Z'],['px','X'],['pc','C']].forEach(([id,k])=>document.getElementById(id).addEventListener('pointerdown',e=>{e.preventDefault();if(S.state!=='play'){press('start');return;}press(k);}));
document.getElementById('screen').addEventListener('pointerdown',()=>press('start'));
[1,3,5].forEach(n=>document.getElementById('d'+n).onclick=()=>{diff=n;[1,3,5].forEach(m=>document.getElementById('d'+m).setAttribute('aria-pressed',String(m===n)));reset();document.getElementById('d'+n).blur();});
window.__race=S;window.__chars=null;

// ---------- HUD ----------
const $=id=>document.getElementById(id);
function showOverlay(){const o=$('ov');o.style.display='block';
  if(S.state==='result'){o.innerHTML=S.result?`<h2>정상 도착! ${'★'.repeat(S.stars)}${'☆'.repeat(3-S.stars)}</h2><p>아저씨: "허허, 요즘 젊은 사람 대단하구먼!"</p><p>Space로 다시 하기</p>`:`<h2>아저씨 승!</h2><p>라이프 1개를 잃었어요. Space로 다시 도전</p>`;}
  else o.innerHTML='<h2>계단 오르기 경주</h2><p>Z·X 번갈아 오르기, 초록 구간에서 C 심호흡</p><p>Space 또는 화면을 눌러 시작</p>';}
function hideOverlay(){$('ov').style.display='none';}
function hud(){
  $('lives').textContent='♥'.repeat(lives)+'♡'.repeat(5-lives);
  $('time').textContent=(S.state==='count'?Math.ceil(S.cd):Math.max(0,TIME-S.t).toFixed(1)+'초');
  $('dp').style.left=(S.p/STEPS*100)+'%';$('dr').style.left=(S.r/STEPS*100)+'%';
  const D=DIFF[diff];$('zone').style.left=D.lo+'%';$('zone').style.width=(D.hi-D.lo)+'%';
  $('bfill').style.width=S.breath+'%';$('bfill').style.background=S.gasp>0?'#e8453c':(S.breath>=D.lo&&S.breath<=D.hi?'#3c8a5a':'#7aa7d6');
  const m=$('msg');const txt=S.state==='count'?String(Math.ceil(S.cd)):(S.msgT>0?S.msg:'');m.textContent=txt;m.style.display=txt?'block':'none';
}

// ---------- 3D 장면 ----------
const screen=$('screen');
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(2,devicePixelRatio));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;
renderer.outputColorSpace=THREE.SRGBColorSpace;
screen.prepend(renderer.domElement);
const effect=new OutlineEffect(renderer,{defaultThickness:0.004,defaultColor:[0.17,0.15,0.13]});
const scene=new THREE.Scene();
const sky=document.createElement('canvas');sky.width=2;sky.height=256;{const c=sky.getContext('2d'),gr=c.createLinearGradient(0,0,0,256);gr.addColorStop(0,'#8fc3e6');gr.addColorStop(.6,'#d7e9ef');gr.addColorStop(1,'#f6e6cc');c.fillStyle=gr;c.fillRect(0,0,2,256);}
const skyTex=new THREE.CanvasTexture(sky);skyTex.colorSpace=THREE.SRGBColorSpace;scene.background=skyTex;
scene.fog=new THREE.Fog(0xe3ecea,18,70);
const camera=new THREE.PerspectiveCamera(38,16/9,0.1,200);
scene.add(new THREE.HemisphereLight(0xfff6e0,0x7a8a6a,1.6));
const sun=new THREE.DirectionalLight(0xffffff,2.2);sun.position.set(-6,12,8);sun.castShadow=true;sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-8,right:8,top:8,bottom:-8,near:1,far:40});scene.add(sun);scene.add(sun.target);

// 툰 그라데이션 (3단계 명암)
const gm=new THREE.DataTexture(new Uint8Array([90,90,90,255,170,170,170,255,255,255,255,255]),3,1);gm.minFilter=gm.magFilter=THREE.NearestFilter;gm.needsUpdate=true;
const toon=(c)=>new THREE.MeshToonMaterial({color:c,gradientMap:gm});

const RUN=0.34, RISE=0.2;           // 한 칸 앞으로·위로
const slope=RISE/RUN;
const stepPos=i=>new THREE.Vector3(i*RUN,i*RISE,0);

// 돌계단
const stairs=new THREE.Group();scene.add(stairs);
const stoneA=toon(0xc9c0b2), stoneB=toon(0xb3a998), tread=toon(0xe2dbcf), moss=toon(0x6f9a4a);
for(let i=0;i<=STEPS+4;i++){
  const p=stepPos(i);
  const h=1.2;
  const b=new THREE.Mesh(new THREE.BoxGeometry(RUN+0.002,h,2.4),i%10===0?stoneB:stoneA);
  b.position.set(p.x+RUN/2,p.y-h/2,0);b.receiveShadow=b.castShadow=true;stairs.add(b);
  const t=new THREE.Mesh(new THREE.BoxGeometry(RUN*0.98,0.03,2.38),tread);t.position.set(p.x+RUN/2,p.y+0.0,0);t.receiveShadow=true;stairs.add(t);
  if(i%3===1){const m=new THREE.Mesh(new THREE.SphereGeometry(0.07,8,6),moss);m.position.set(p.x+0.05,p.y+0.02,1.1);m.scale.y=0.6;stairs.add(m);}
}
// 철 난간
const railMat=toon(0x5a4c3e);
for(const z of [-1.25]){
  const len=Math.hypot(STEPS*RUN,STEPS*RISE);
  const rail=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,len,6),railMat);
  rail.position.set(STEPS*RUN/2,STEPS*RISE/2+0.75,z);rail.rotation.z=-(Math.PI/2-Math.atan(slope));stairs.add(rail);
  for(let i=0;i<=STEPS;i+=5){const p=stepPos(i);const post=new THREE.Mesh(new THREE.CylinderGeometry(0.025,0.025,0.75,6),railMat);post.position.set(p.x+RUN/2,p.y+0.375,z);stairs.add(post);}
}
// 경사진 산비탈
const groundMat=toon(0x9bb06a);
const ground=new THREE.Mesh(new THREE.PlaneGeometry(90,60,30,20),groundMat);
ground.rotation.order='ZXY';ground.rotation.x=-Math.PI/2;ground.rotation.z=0;
{const g=ground.geometry,pos=g.attributes.position;for(let i=0;i<pos.count;i++){const x=pos.getX(i),y=pos.getY(i);pos.setZ(i,(Math.sin(x*0.7)+Math.cos(y*0.9))*0.15);}g.computeVertexNormals();}
const groundPivot=new THREE.Group();groundPivot.add(ground);groundPivot.rotation.z=Math.atan(slope);groundPivot.position.set(STEPS*RUN/2,STEPS*RISE/2-0.6,0);scene.add(groundPivot);ground.receiveShadow=true;
const groundY=(x)=>x*slope-0.6;

// 나무: 단풍·소나무
const rnd=(()=>{let s=7;return()=>(s=(s*16807)%2147483647)/2147483647;})();
const leafCols=[0xe36b3c,0xf2a33a,0xc9472b,0xe8873a,0xd9502e,0x6f9a4a,0x4f7a3a];
const trunkMat=toon(0x6b4a33);
const treeGroup=new THREE.Group();scene.add(treeGroup);
for(let n=0;n<170;n++){
  const x=-12+rnd()*(STEPS*RUN+30), side=rnd()<0.5?-1:1, z=side*(2+rnd()*14);
  if(z>0&&z<9)continue; // 카메라 앞은 비워 두기
  const y=groundY(x)+0.1;const s=0.7+rnd()*0.9;const t=new THREE.Group();
  const trunk=new THREE.Mesh(new THREE.CylinderGeometry(0.06*s,0.1*s,1.1*s,6),trunkMat);trunk.position.y=0.55*s;t.add(trunk);
  const col=leafCols[Math.floor(rnd()*leafCols.length)];
  if(col===0x4f7a3a){for(let k=0;k<3;k++){const c=new THREE.Mesh(new THREE.ConeGeometry((0.6-k*0.15)*s,0.8*s,7),toon(col));c.position.y=(1.0+k*0.45)*s;t.add(c);}}
  else{for(let k=0;k<4;k++){const b=new THREE.Mesh(new THREE.IcosahedronGeometry((0.38+rnd()*0.25)*s,0),toon(col));b.position.set((rnd()-.5)*0.6*s,(1.25+rnd()*0.5)*s,(rnd()-.5)*0.6*s);t.add(b);}}
  t.position.set(x,y,z);t.traverse(o=>{if(o.isMesh){o.castShadow=true;}});treeGroup.add(t);
}
// 먼 화강암 봉우리
const rockMat=toon(0xb9b2a6), snowMat=toon(0xf2efe8);
for(let n=0;n<14;n++){
  const x=-20+n*6+rnd()*4, h=10+rnd()*14, r=4+rnd()*4;
  const m=new THREE.Mesh(new THREE.ConeGeometry(r,h,6),rockMat);m.position.set(x,groundY(x)*0.4+h/2-2,-40-rnd()*15);m.rotation.y=rnd();scene.add(m);
}
// 정상 깃발
{const top=stepPos(STEPS);const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.03,0.03,1.6,6),railMat);pole.position.set(top.x+0.6,top.y+0.8,-0.6);scene.add(pole);
 const flag=new THREE.Mesh(new THREE.PlaneGeometry(0.6,0.36),new THREE.MeshToonMaterial({color:0xe8453c,side:THREE.DoubleSide,gradientMap:gm}));flag.position.set(top.x+0.9,top.y+1.42,-0.6);scene.add(flag);}

// ---------- 캐릭터 ----------
const chars={};
function makeChar(gltf,color,z,name){
  const root=SkeletonUtils.clone(gltf.scene);
  root.scale.setScalar(0.22); // 모델 키 약 4.8 → 1.05
  root.traverse(o=>{if(o.isMesh){o.castShadow=true;const old=o.material;const c=old.name==='Main'?new THREE.Color(color):old.color.clone();o.material=new THREE.MeshToonMaterial({color:c,gradientMap:gm});}});
  const holder=new THREE.Group();holder.add(root);root.rotation.y=Math.PI/2;holder.position.z=z;scene.add(holder);
  const mixer=new THREE.AnimationMixer(root);const acts={};for(const clip of gltf.animations)acts[clip.name]=mixer.clipAction(clip);
  for(const k of ['Jump','ThumbsUp','Death','Yes','No','Wave']){acts[k].setLoop(THREE.LoopOnce);acts[k].clampWhenFinished=true;}
  const c={holder,root,mixer,acts,cur:null,name};c.play=(n,fade=0.18,ts=1)=>{const a=acts[n];a.timeScale=ts;if(c.cur===n)return;const prev=c.cur&&acts[c.cur];a.reset().play();if(prev)prev.crossFadeTo(a,fade,false);c.cur=n;};
  // 이름표
  const cv=document.createElement('canvas');cv.width=256;cv.height=64;const x=cv.getContext('2d');x.fillStyle=color===0xe36b3c?'#e36b3c':'#3c8a5a';x.beginPath();x.roundRect(4,4,248,56,16);x.fill();x.fillStyle='#fff';x.font='700 36px "Noto Sans KR",sans-serif';x.textAlign='center';x.fillText(name,128,46);
  const tex=new THREE.CanvasTexture(cv);tex.colorSpace=THREE.SRGBColorSpace;const sp=new THREE.Sprite(new THREE.SpriteMaterial({map:tex,depthTest:false}));sp.scale.set(0.5,0.125,1);sp.position.y=1.35;sp.renderOrder=10;holder.add(sp);
  c.play('Idle');return c;
}
new GLTFLoader().load('assets/robot-cc0.gltf.json',gltf=>{
  chars.p=makeChar(gltf,0xe36b3c,0.45,'나');
  chars.r=makeChar(gltf,0x3c8a5a,-0.45,'아저씨');
  window.__chars=chars;$("load").remove();reset();
},undefined,e=>{$('load').textContent='모델을 불러오지 못했어요';});

function placeChar(c,pv,lag){
  const f=pv%1, moving=lag>0.03;
  const p=stepPos(pv);const hop=moving?Math.sin(f*Math.PI)*0.1:0;
  c.holder.position.x=p.x+RUN*0.5;c.holder.position.y=p.y+hop;
}
let camT=new THREE.Vector3();
function updateChars(dt){
  if(!chars.p)return;
  const {p,r}=chars;
  placeChar(p,S.pv,S.p-S.pv);placeChar(r,S.rv,S.r-S.rv);
  // 동작 고르기
  if(S.state==='result'){p.play(S.result?'Jump':'Sitting',0.25);if(p.acts.Jump.paused&&S.result)p.play('Dance',0.3);r.play(S.result?'No':'Wave',0.25);}
  else if(S.state!=='play'){p.play('Idle');r.play('Idle');}
  else{
    const recent=S.t-S.lastStep<0.45;
    if(S.gasp>0)p.play('Idle',0.15,2.4);
    else if(S.stun>0)p.play('Idle',0.1,1);
    else if(recent){const fast=S.pRate>4.5;p.play(fast?'Running':'Walking',0.15,Math.min(1.6,Math.max(0.7,S.pRate/(fast?6:3.5))));}
    else p.play('Idle',0.25);
    r.play(S.rPause>0?'Idle':(DIFF[diff].rival>5?'Running':'Walking'),0.2,DIFF[diff].rival/(DIFF[diff].rival>5?6:4));
  }
  // 숨찰 때 앞으로 숙이기
  p.root.rotation.z=THREE.MathUtils.lerp(p.root.rotation.z,S.gasp>0?0.35:0,dt*8);
  p.mixer.update(dt);r.mixer.update(dt);
  // 카메라: 옆에서 살짝 비스듬히, 주인공을 부드럽게 따라감
  const tgt=stepPos(Math.max(S.pv,0)).add(new THREE.Vector3(0.9,0.55,0));
  camT.lerp(tgt,Math.min(1,dt*4));
  camera.position.set(camT.x-0.4,camT.y+1.3,camT.z+7.2);camera.lookAt(camT.x+1.2,camT.y+0.5,0);
  sun.position.set(camT.x-6,camT.y+12,8);sun.target.position.copy(camT);
}

function update(dt){
  S.msgT=Math.max(0,S.msgT-dt);
  if(S.state==='count'){S.cd-=dt;if(S.cd<=0){S.state='play';beep(880,.15);say('출발!',0.7);}return;}
  if(S.state!=='play'){S.pv+=(S.p-S.pv)*Math.min(1,dt*10);S.rv+=(S.r-S.rv)*Math.min(1,dt*10);return;}
  S.t+=dt;
  S.pv+=(S.p-S.pv)*Math.min(1,dt*14);S.rv+=(S.r-S.rv)*Math.min(1,dt*14);
  S.stun=Math.max(0,S.stun-dt);S.boost=Math.max(0,S.boost-dt);
  if(S.gasp>0){S.gasp-=dt;if(S.gasp<=0)S.breath=55;}else S.breath=Math.max(0,S.breath-3*dt);
  if(S.rPause>0)S.rPause-=dt;
  else{S.rNext+=dt*DIFF[diff].rival*(0.9+Math.random()*0.2);while(S.rNext>=1){S.rNext-=1;S.r=Math.min(STEPS,S.r+1);if(S.r%12===0)S.rPause=0.7;}}
  if(S.r>=STEPS){finish(false);return;}
  if(S.t>=TIME)finish(false);
}
function resize(){const w=screen.clientWidth,h=screen.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
new ResizeObserver(resize).observe(screen);resize();
const clock=new THREE.Clock();
function loop(){const dt=Math.min(0.05,clock.getDelta());update(dt);updateChars(dt);hud();effect.render(scene,camera);requestAnimationFrame(loop);}
reset();loop();
</script>
